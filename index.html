<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Munyaka School Portal</title>
    <!-- Use relative paths so assets resolve correctly under Capacitor's file:// URL -->
    <link rel="manifest" href="./manifest.json" />
  </head>

  <body class="overflow-x-hidden antialiased select-none touch-manipulation">
    <div id="root">
      <h1 style="font-family:system-ui,-apple-system,sans-serif;padding:20px;color:#2563eb;">Loading Munyaka Portal...</h1>
    </div>
    <!-- Module path resolves correctly in both dev server and file:// Android WebView -->
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(registration => {
            console.log('SW registered: ', registration);
          }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
    </script>
  </body>
</html>
